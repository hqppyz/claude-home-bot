paths:
  - /home/me:
      mode: manual # no channels will be created, instead, it will only link the includes to their channel
      channel_id: '1234' # required when using manual mode
      args: ['--setting-sources', 'user'] # optional, ignores /home/me/.claude
  - /home/me/Projects:
      mode: auto # automatically manages creation and deletion of channels based off the parent directory
      category_id: '1234' # optional, channels go under this category
      include: # a glob or a list of globs; channels follow this order, "." is the path itself
        - claude-home-bot
        - 'whatever'
  - /home/me/Documents:
      mode: auto # no category_id, so the channels go at the top of the server
      permissions: plan # optional, replaces claude.permissions for these sessions
      env: # optional, merged over claude.env
        DISABLE_AUTOUPDATER: '1'
      include:
        - '.' # Documents itself
        - '*' # every subdirectory
      exclude: # optional, globs to leave out of include
        - Photos
        - Pictures

discord:
  token: CHANGEME # not needed when DISCORD_TOKEN is set
  server-id: '1234' # this is a single server bot
  admin-id: '1234' # a user id, a list of user ids, of people that can manage the bot
  # admin-only: true # optional, defaults to true; if disabled, anybody can chat with the bot

claude:
  permissions: manual # manual, acceptEdits, auto, bypassPermissions, dontAsk or plan
  effort: low # effort each session starts at: low, medium, high, xhigh or max; /effort changes it until the session ends
  args: # optional, extra `claude` arguments for every session
    - --disallowedTools # tools a Discord chat has no use for
    - ReportFindings
    - ListAgents
    - ScheduleWakeup
  env: # optional, extra environment for every session
    ENABLE_CLAUDEAI_MCP_SERVERS: 'false' # no claude.ai connectors (Claude Docs and similar)
